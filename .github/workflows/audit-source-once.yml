name: Verify pinned Git source tree playwright
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/microsoft/playwright.git
      upstream_sha: b4d016aadc5cbd2b898a284307975fe73e05483d
      audit_slug: playwright
